[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-video"
version = "0.3.1"
description = "Moteur de montage vidéo commun : blancs coupés, sous-titres mot par mot, B-roll, musique sous la voix, carton de fin, page de review."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "playwright", "faster-whisper", "av<16", "yt-dlp"]

[project.optional-dependencies]
tests = ["pytest"]

[project.scripts]
studio-video = "studio_video.cli:main"

[tool.setuptools]
packages = ["studio_video"]

[tool.setuptools.package-data]
studio_video = ["modeles/*"]
